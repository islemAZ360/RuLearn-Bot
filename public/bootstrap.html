<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RuLearn - جاري الاتصال</title>
    <style>
        :root {
            --bg-color: #020617;
            --accent-color: #6366f1;
            --text-color: #f8fafc;
            --muted-color: #94a3b8;
            --error-color: #ef4444;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        .container {
            width: 85%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 1.5rem;
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border-radius: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3); }
            50% { transform: scale(1.05); box-shadow: 0 15px 30px rgba(99, 102, 241, 0.5); }
            100% { transform: scale(1); box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3); }
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0 0 0.5rem 0;
            letter-spacing: -0.025em;
        }

        p {
            color: var(--muted-color);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .loader {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 1.5rem;
            display: none;
        }

        .loader-bar {
            height: 100%;
            background: var(--accent-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.875rem 2rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            text-decoration: none;
            display: block;
        }

        .btn:active {
            transform: scale(0.98);
            background-color: #4f46e5;
        }

        .vpn-hint {
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px dashed rgba(239, 68, 68, 0.3);
            border-radius: 0.75rem;
            font-size: 0.85rem;
            color: #fca5a5;
            display: none;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--muted-color);
            margin-left: 8px;
        }

        .status-online { background-color: #10b981; }
        .status-offline { background-color: #ef4444; }

    </style>
</head>
<body>

    <div class="container">
        <div style="display: flex; justify-content: center;">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 8V4H8"></path>
                    <rect width="16" height="12" x="4" y="8" rx="2"></rect>
                    <path d="M2 14h2"></path>
                    <path d="M20 14h2"></path>
                    <path d="M15 13v2"></path>
                    <path d="M9 13v2"></path>
                </svg>
            </div>
        </div>

        <h1 id="title">RuLearn Bot</h1>
        <p id="message">جاري التحقق من الاتصال بالخادم الرئيسي...</p>

        <div id="loader" class="loader" style="display: block;">
            <div id="loader-bar" class="loader-bar"></div>
        </div>

        <div id="vpn-hint" class="vpn-hint">
            <strong>تنبيه:</strong> يبدو أن الوصول للموقع محظور في منطقتك. يرجى تفعيل <strong>VPN</strong> والمحاولة مرة أخرى.
        </div>

        <button id="retry-btn" class="btn" style="display: none;" onclick="checkConnection()">إعادة المحاولة</button>
    </div>

    <script>
        const TARGET_URL = 'https://ru-learn-bot.vercel.app/';
        const messageEl = document.getElementById('message');
        const loaderBar = document.getElementById('loader-bar');
        const vpnHint = document.getElementById('vpn-hint');
        const retryBtn = document.getElementById('retry-btn');
        const loader = document.getElementById('loader');

        let progress = 0;
        const progressInterval = setInterval(() => {
            if (progress < 90) {
                progress += Math.random() * 10;
                loaderBar.style.width = Math.min(progress, 90) + '%';
            }
        }, 300);

        async function checkConnection() {
            vpnHint.style.display = 'none';
            retryBtn.style.display = 'none';
            loader.style.display = 'block';
            messageEl.innerText = 'جاري الاتصال...';
            
            try {
                // محاولة الاتصال بـ Vercel
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);
                
                await fetch(TARGET_URL, { 
                    mode: 'no-cors', 
                    signal: controller.signal,
                    cache: 'no-store'
                });
                
                clearTimeout(timeoutId);
                loaderBar.style.width = '100%';
                messageEl.innerText = 'تم الاتصال! جاري التحميل...';
                
                setTimeout(() => {
                    window.location.href = TARGET_URL;
                }, 500);

            } catch (error) {
                console.error('Connection failed:', error);
                clearInterval(progressInterval);
                loader.style.display = 'none';
                messageEl.innerText = 'فشل الاتصال بالخادم الرئيسي.';
                vpnHint.style.display = 'block';
                retryBtn.style.display = 'block';
            }
        }

        // بدء الفحص فوراً
        setTimeout(checkConnection, 1000);
    </script>
</body>
</html>
